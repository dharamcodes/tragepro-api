<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 320" width="100%" height="100%">
  <defs>
    <!-- Markers -->
    <marker id="arrow-sky" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34D399"/>
    </marker>
  </defs>

  <!-- Flow Header -->
  <g transform="translate(45, 25)">
    <rect x="0" y="0" width="90" height="24" rx="12" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="45" y="16" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing="1">FLOW 03</text>
    <text x="105" y="19" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800">Workflow Orchestration</text>
    <text x="0" y="44" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="12">Temporal Worker engine discovery, decoupled ActivityRegistry, cross-module adapter invocation, and state hydration</text>
  </g>

  <!-- Connectors -->
  <path d="M 225 185 L 265 185" fill="none" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow-sky)"/>
  <path d="M 445 185 L 485 185" fill="none" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow-sky)"/>
  <path d="M 665 185 L 705 185" fill="none" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow-sky)"/>
  <path d="M 915 185 L 955 185" fill="none" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow-sky)"/>
  <path d="M 1165 185 L 1205 185" fill="none" stroke="#34D399" stroke-width="2" marker-end="url(#arrow-emerald)"/>

  <!-- Step 1: Temporal Worker Engine -->
  <g transform="translate(45, 120)">
    <rect x="0" y="0" width="180" height="130" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <circle cx="90" cy="35" r="14" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
    <path d="M 85 35 L 95 35 M 90 30 L 90 40 M 82 32 L 86 35 L 82 38 M 98 32 L 94 35 L 98 38" fill="none" stroke="#38BDF8" stroke-width="1.3"/>
    <text x="90" y="70" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Temporal Worker</text>
    <text x="90" y="88" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Engine</text>
    <text x="90" y="112" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle">Worker Pool Listener</text>
  </g>

  <!-- Step 2: TemporalConfig -->
  <g transform="translate(265, 120)">
    <rect x="0" y="0" width="180" height="130" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <circle cx="90" cy="35" r="14" fill="#0F172A" stroke="#818CF8" stroke-width="1.5"/>
    <circle cx="90" cy="35" r="5" fill="none" stroke="#818CF8" stroke-width="1.5"/>
    <text x="90" y="72" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle">TemporalConfig</text>
    <text x="90" y="93" fill="#818CF8" font-family="monospace" font-size="9.5" text-anchor="middle">@Configuration</text>
    <text x="90" y="112" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle">Auto-Wires Worker</text>
  </g>

  <!-- Step 3: ActivityRegistry -->
  <g transform="translate(485, 120)">
    <rect x="0" y="0" width="180" height="130" rx="10" fill="#1E293B" stroke="#0284C7" stroke-width="2"/>
    <circle cx="90" cy="35" r="14" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
    <path d="M 84 31 L 96 31 M 84 35 L 96 35 M 84 39 L 92 39" fill="none" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="90" y="72" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle">ActivityRegistry</text>
    <text x="90" y="93" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" text-anchor="middle">Registry Pattern</text>
    <text x="90" y="112" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle">Discovers Activities</text>
  </g>

  <!-- Step 4: DataInitActivityImpl (BaseActivity) -->
  <g transform="translate(705, 120)">
    <rect x="0" y="0" width="210" height="130" rx="10" fill="#1E293B" stroke="#A855F7" stroke-width="2"/>
    <circle cx="105" cy="35" r="14" fill="#0F172A" stroke="#C084FC" stroke-width="1.5"/>
    <path d="M 99 35 L 111 35 M 105 29 L 105 41" fill="none" stroke="#C084FC" stroke-width="1.5"/>
    <text x="105" y="70" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">DataInitActivityImpl</text>
    <text x="105" y="90" fill="#C084FC" font-family="monospace" font-size="9.5" text-anchor="middle">(BaseActivity)</text>
    <text x="105" y="112" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle">Executes Initialization</text>
  </g>

  <!-- Step 5: WatchListAdapter (Datafeed Module) -->
  <g transform="translate(955, 120)">
    <rect x="0" y="0" width="210" height="130" rx="10" fill="#1E293B" stroke="#0284C7" stroke-width="2"/>
    <circle cx="105" cy="35" r="14" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
    <path d="M 98 30 L 112 30 L 112 40 L 98 40 Z M 101 34 L 109 34" fill="none" stroke="#38BDF8" stroke-width="1.3"/>
    <text x="105" y="70" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">WatchListAdapter</text>
    <text x="105" y="90" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" text-anchor="middle">(Datafeed Module)</text>
    <text x="105" y="112" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle">Fetches Symbol List</text>
  </g>

  <!-- Step 6: StrategyContext -->
  <g transform="translate(1205, 120)">
    <rect x="0" y="0" width="160" height="130" rx="10" fill="#1E293B" stroke="#059669" stroke-width="2"/>
    <circle cx="80" cy="35" r="14" fill="#0F172A" stroke="#34D399" stroke-width="1.5"/>
    <path d="M 73 35 L 78 40 L 87 30" fill="none" stroke="#34D399" stroke-width="1.8" stroke-linecap="round"/>
    <text x="80" y="72" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">StrategyContext</text>
    <text x="80" y="94" fill="#34D399" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" text-anchor="middle">In-Memory State</text>
    <text x="80" y="112" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle">Hydrated &amp; Ready</text>
  </g>

</svg>
