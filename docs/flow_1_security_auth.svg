<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 300" width="100%" height="100%">
  <defs>
    <!-- Markers -->
    <marker id="arrow-sky" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34D399"/>
    </marker>
  </defs>

  <!-- Flow Header -->
  <g transform="translate(45, 25)">
    <rect x="0" y="0" width="90" height="24" rx="12" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="45" y="16" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing="1">FLOW 01</text>
    <text x="105" y="19" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800">Core Security &amp; JWT Authentication</text>
    <text x="0" y="44" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="12">Intercept HTTP requests, decode JWT claims, resolve UserDetails, and populate Spring Security Context</text>
  </g>

  <!-- Connectors -->
  <path d="M 285 185 L 345 185" fill="none" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#arrow-sky)"/>
  <path d="M 585 185 L 645 185" fill="none" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#arrow-sky)"/>
  <path d="M 895 185 L 955 185" fill="none" stroke="#34D399" stroke-width="2.5" marker-end="url(#arrow-emerald)"/>

  <!-- Step 1: HTTP Request -->
  <g transform="translate(45, 120)">
    <rect x="0" y="0" width="240" height="130" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <circle cx="120" cy="36" r="16" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
    <path d="M 112 36 L 128 36 M 120 28 C 124 32 124 40 120 44 C 116 40 116 32 120 28 Z M 112 36 C 112 31.5 115.5 28 120 28 C 124.5 28 128 31.5 128 36 C 128 40.5 124.5 44 120 44 C 115.5 44 112 40.5 112 36 Z" fill="none" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="120" y="74" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" text-anchor="middle">HTTP Request</text>
    <text x="120" y="94" fill="#38BDF8" font-family="monospace" font-size="10.5" text-anchor="middle">Bearer &lt;JWT_TOKEN&gt;</text>
    <text x="120" y="112" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" text-anchor="middle">Incoming Client API Call</text>
  </g>

  <!-- Step 2: JWTAuthFilter -->
  <g transform="translate(345, 120)">
    <rect x="0" y="0" width="240" height="130" rx="10" fill="#1E293B" stroke="#0284C7" stroke-width="2"/>
    <circle cx="120" cy="36" r="16" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
    <path d="M 120 28 L 128 32 L 128 37 C 128 41.5 124.5 44 120 45 C 115.5 44 112 41.5 112 37 L 112 32 Z" fill="none" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="120" y="74" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" text-anchor="middle">JWTAuthFilter</text>
    <text x="120" y="94" fill="#38BDF8" font-family="monospace" font-size="10.5" text-anchor="middle">OncePerRequestFilter</text>
    <text x="120" y="112" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" text-anchor="middle">Validates Token &amp; Claims</text>
  </g>

  <!-- Step 3: AuthenticationAdapter / UserDetailAdapter -->
  <g transform="translate(645, 120)">
    <rect x="0" y="0" width="250" height="130" rx="10" fill="#1E293B" stroke="#6366F1" stroke-width="2"/>
    <circle cx="125" cy="36" r="16" fill="#0F172A" stroke="#818CF8" stroke-width="1.5"/>
    <circle cx="125" cy="33" r="4" fill="none" stroke="#818CF8" stroke-width="1.5"/>
    <path d="M 118 42 C 118 39 121 37 125 37 C 129 37 132 39 132 42" fill="none" stroke="#818CF8" stroke-width="1.5"/>
    <text x="125" y="72" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">AuthenticationAdapter</text>
    <text x="125" y="89" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">/ UserDetailAdapter</text>
    <text x="125" y="112" fill="#818CF8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" text-anchor="middle">Loads User &amp; Authorities</text>
  </g>

  <!-- Step 4: Spring Security Context -->
  <g transform="translate(955, 120)">
    <rect x="0" y="0" width="250" height="130" rx="10" fill="#1E293B" stroke="#059669" stroke-width="2"/>
    <circle cx="125" cy="36" r="16" fill="#0F172A" stroke="#34D399" stroke-width="1.5"/>
    <path d="M 116 36 L 122 42 L 134 30" fill="none" stroke="#34D399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="125" y="73" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Spring Security</text>
    <text x="125" y="92" fill="#34D399" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle">Context</text>
    <text x="125" y="112" fill="#94A3B8" font-family="monospace" font-size="10" text-anchor="middle">SecurityContextHolder</text>
  </g>

</svg>
