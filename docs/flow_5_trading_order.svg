<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Markers -->
    <marker id="arrow-sky" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#FBBF24"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34D399"/>
    </marker>
  </defs>

  <!-- Flow Header -->
  <g transform="translate(45, 25)">
    <rect x="0" y="0" width="90" height="24" rx="12" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="45" y="16" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing="1">FLOW 05</text>
    <text x="105" y="19" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800">Portfolio Position &amp; Order Execution</text>
    <text x="0" y="44" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="12">Direct Controller to Service delegation, cross-module journaling via JournalAdapter, and MongoDB persistence</text>
  </g>

  <!-- Connectors -->
  <path d="M 235 200 L 285 200" fill="none" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow-sky)"/>
  <path d="M 485 200 L 535 200" fill="none" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow-sky)"/>
  <path d="M 775 200 L 825 200" fill="none" stroke="#FBBF24" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <path d="M 1025 200 L 1065 200" fill="none" stroke="#34D399" stroke-width="2" marker-end="url(#arrow-emerald)"/>

  <!-- Step 1: Trading Signal / Client -->
  <g transform="translate(45, 140)">
    <rect x="0" y="0" width="190" height="120" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <text x="95" y="46" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle">Trading Signal /</text>
    <text x="95" y="66" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle">Client Request</text>
    <text x="95" y="92" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" text-anchor="middle">Signal / REST Trigger</text>
  </g>

  <!-- Step 2: OrderController -->
  <g transform="translate(285, 140)">
    <rect x="0" y="0" width="200" height="120" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <text x="100" y="46" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle">OrderController</text>
    <text x="100" y="70" fill="#38BDF8" font-family="monospace" font-size="9.5" text-anchor="middle">@RestController</text>
    <text x="100" y="92" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle">Web Entrypoint</text>
  </g>

  <!-- Step 3: OrderManagerImpl & TradingServiceImpl -->
  <g transform="translate(535, 130)">
    <rect x="0" y="0" width="240" height="140" rx="10" fill="#1E293B" stroke="#0284C7" stroke-width="2"/>
    <text x="120" y="45" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">OrderManagerImpl</text>
    <text x="120" y="65" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">&amp; TradingServiceImpl</text>
    <text x="120" y="95" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" text-anchor="middle">Order Lifecycle Engine</text>
    <text x="120" y="112" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" text-anchor="middle">&amp; Position Validation</text>
  </g>

  <!-- Step 4: JournalAdapter (Cross-Module) -->
  <g transform="translate(825, 140)">
    <rect x="0" y="0" width="200" height="120" rx="10" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
    <text x="100" y="46" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle">JournalAdapter</text>
    <text x="100" y="70" fill="#FBBF24" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" text-anchor="middle">(Journal Module Adapter)</text>
    <text x="100" y="92" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle">Cross-Module Log Entry</text>
  </g>

  <!-- Step 5: MongoDB Data Store -->
  <g transform="translate(1065, 130)">
    <rect x="0" y="0" width="110" height="140" rx="10" fill="#1E293B" stroke="#059669" stroke-width="2"/>
    <ellipse cx="55" cy="38" rx="22" ry="7" fill="none" stroke="#34D399" stroke-width="1.5"/>
    <path d="M 33 38 L 33 64 A 22 7 0 0 0 77 64 L 77 38" fill="none" stroke="#34D399" stroke-width="1.5"/>
    <path d="M 33 51 A 22 7 0 0 0 77 51" fill="none" stroke="#34D399" stroke-width="1.5"/>
    <text x="55" y="95" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">MongoDB</text>
    <text x="55" y="115" fill="#34D399" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">Data Store</text>
  </g>

</svg>
