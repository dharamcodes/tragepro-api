name: Java CI with Gradle

on:
  push:
    branches: ["main", "develop", "release"]
  pull_request:
    branches: ["main", "develop", "release"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      # MongoDB init vars (used by compose.yaml / local profiles - kept for parity)
      MONGO_INIT_DATABASE: tragepro
      MONGO_INIT_PASSWORD: admin
      MONGO_INIT_USERNAME: admin

      # Activate the test Spring profile so application-test.yml is loaded
      SPRING_PROFILES_ACTIVE: test

      # Testcontainers – allow container reuse across tests in the same JVM run
      # (honours the withReuse(true) flag in ContainerConfig without needing
      # a local ~/.testcontainers.properties file on the runner)
      TESTCONTAINERS_REUSE_ENABLE: "true"

      # Testcontainers – disable Ryuk (resource reaper) in CI; containers are
      # cleaned up when the runner VM is destroyed after the job finishes
      TESTCONTAINERS_RYUK_DISABLED: "true"

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin

      # Verify Docker is available for Testcontainers (MongoDBContainer + WireMock)
      - name: Verify Docker daemon
        run: docker info

      # Cache Gradle dependencies and build outputs
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Compile + assemble only — tests run in the dedicated check step below
      # so they are not executed twice (build includes test by default)
      - name: Build with Gradle Wrapper
        run: ./gradlew build -x test --info

      # Runs: test → jacocoTestReport → jacocoTestCoverageVerification (≥ 95 % line coverage)
      # MongoDBContainer (replica-set) and WireMock are spun up here via Testcontainers
      - name: Run tests and verify coverage
        run: ./gradlew check --info

      # Upload JaCoCo HTML report as a build artifact for review
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: build/jacoco/test/html/
          retention-days: 7

  dependency-submission:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin

      # Generates and submits a dependency graph, enabling Dependabot Alerts for all project dependencies.
      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
