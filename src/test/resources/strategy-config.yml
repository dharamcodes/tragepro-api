workflow:
  strategy:
    - name: INTRADAY_VP_VWAP
      timeframe:
        - value: 5
          uom: MIN
          type: LOWER
        - value: 15
          uom: MIN
          type: HIGHER
      strategySteps:
        strategyBuilder:
          - name: BUILD_TIMEFRAME_DATA
            time: 50
            uom: DAY
          - name: BUILD_VOLUME_PROFILE
            time: 50
            uom: DAY
          - name: BUILD_BID_ASK_LEVELS
            time: 50
            uom: DAY
          - name: BUILD_VWAP_LEVELS
            time: 50
            uom: DAY
          - name: BUILD_LIQUIDITY_LEVELS
            time: 50
            uom: DAY
        strategyEvaluator:
          - name: EVALUATE_VOLUME_PROFILE
            probability: 0.2
          - name: EVALUATE_VOLUME_VWAP
            probability: 0.1
          - name: EVALUATE_LIQUIDITY_LEVELS
            probability: 0.4
        strategyExecutor:
          - name: EXECUTE_BUY
