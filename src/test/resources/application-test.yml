server:
  port: 8081

spring:
  main:
    register-shutdown-hook: false
  mongodb:
    representation:
      uuid: standard

logging:
  level:
    root: INFO
    org.springframework: INFO
    org.springframework.boot.context.config: INFO
    org.springframework.boot.autoconfigure.mongo.embedded: INFO

data:
  fetch:
    daysBack: 5
  watchlist:
    identifiers: "AAPL,MSFT"
  scheduler:
    fromDateDays: 90
    enableHistorical: false
    enableIntraday: true
    jobs:
      morning: "0 0 8 * * ?"
      evening: "0 0 16 * * ?"
  rest:
    clientName: MockClient
    baseUrl: https://mock-api.com
    conTimeout: 5000
    readTimeout: 10000
    clientHeaders:
      - name: Accept
        value: application/json

jwt:
  secret: UVVETsBqGWkYVZrM+VWTEMPn/aHp+HLjJL8hQlFyytQ=
  expirationMinutes: 7200
  resetPasswordExpirationMinutes: 15
