<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 360" width="100%" height="100%">
  <defs>
    <!-- Markers -->
    <marker id="arrow-sky" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#818CF8"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#FBBF24"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34D399"/>
    </marker>
  </defs>

  <!-- Flow Header -->
  <g transform="translate(45, 25)">
    <rect x="0" y="0" width="90" height="24" rx="12" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="45" y="16" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing="1">FLOW 05</text>
    <text x="105" y="19" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800">Portfolio Position &amp; Order Execution</text>
    <text x="0" y="44" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="12">Order routing through OrderManager and TradingService, cross-module journaling via JournalAdapter, and MongoDB persistence</text>
  </g>

  <!-- Connectors -->
  <path d="M 215 200 L 265 200" fill="none" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow-sky)"/>
  
  <!-- Branch Out from OrderController -->
  <path d="M 435 185 L 465 185 L 465 145 L 490 145" fill="none" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow-sky)"/>
  <path d="M 435 215 L 465 215 L 465 255 L 490 255" fill="none" stroke="#818CF8" stroke-width="2" marker-end="url(#arrow-indigo)"/>
  
  <!-- Converge to OrderManagerImpl & TradingServiceImpl -->
  <path d="M 685 145 L 715 145 L 715 185 L 740 185" fill="none" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow-sky)"/>
  <path d="M 685 255 L 715 255 L 715 215 L 740 215" fill="none" stroke="#818CF8" stroke-width="2" marker-end="url(#arrow-sky)"/>

  <!-- Converge to JournalAdapter -->
  <path d="M 965 200 L 1005 200" fill="none" stroke="#FBBF24" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <!-- JournalAdapter to Mongo -->
  <path d="M 1195 200 L 1235 200" fill="none" stroke="#34D399" stroke-width="2" marker-end="url(#arrow-emerald)"/>

  <!-- Step 1: Trading Signal / Client -->
  <g transform="translate(45, 140)">
    <rect x="0" y="0" width="170" height="120" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <text x="85" y="46" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Trading Signal /</text>
    <text x="85" y="66" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Client Request</text>
    <text x="85" y="92" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" text-anchor="middle">Signal / Manual Trigger</text>
  </g>

  <!-- Step 2: OrderController -->
  <g transform="translate(265, 140)">
    <rect x="0" y="0" width="170" height="120" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <text x="85" y="46" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle">OrderController</text>
    <text x="85" y="70" fill="#38BDF8" font-family="monospace" font-size="9.5" text-anchor="middle">@RestController</text>
    <text x="85" y="92" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle">REST Web Layer</text>
  </g>

  <!-- Step 3A: OrderAdapter & TradingAdapter -->
  <g transform="translate(490, 105)">
    <rect x="0" y="0" width="195" height="80" rx="8" fill="#1E293B" stroke="#0284C7" stroke-width="2"/>
    <text x="97" y="32" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">OrderAdapter &amp;</text>
    <text x="97" y="50" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">TradingAdapter</text>
    <text x="97" y="68" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" text-anchor="middle">Order Placement &amp; Validation</text>
  </g>

  <!-- Step 3B: TradingAdapter -->
  <g transform="translate(490, 215)">
    <rect x="0" y="0" width="195" height="80" rx="8" fill="#1E293B" stroke="#6366F1" stroke-width="2"/>
    <text x="97" y="38" fill="#818CF8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">TradingAdapter</text>
    <text x="97" y="60" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" text-anchor="middle">Position &amp; Portfolio State</text>
  </g>

  <!-- Step 4: OrderManagerImpl & TradingServiceImpl -->
  <g transform="translate(740, 130)">
    <rect x="0" y="0" width="225" height="140" rx="10" fill="#1E293B" stroke="#0284C7" stroke-width="2"/>
    <text x="112" y="45" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">OrderManagerImpl</text>
    <text x="112" y="65" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">&amp; TradingServiceImpl</text>
    <text x="112" y="95" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" text-anchor="middle">Order Lifecycle Engine</text>
    <text x="112" y="112" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" text-anchor="middle">&amp; Balance Verification</text>
  </g>

  <!-- Step 5: JournalAdapter -->
  <g transform="translate(1005, 140)">
    <rect x="0" y="0" width="190" height="120" rx="10" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
    <text x="95" y="46" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle">JournalAdapter</text>
    <text x="95" y="70" fill="#FBBF24" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" text-anchor="middle">(Journal Module)</text>
    <text x="95" y="92" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle">Cross-Module Log Entry</text>
  </g>

  <!-- Step 6: MongoDB Data Store -->
  <g transform="translate(1235, 130)">
    <rect x="0" y="0" width="125" height="140" rx="10" fill="#1E293B" stroke="#059669" stroke-width="2"/>
    <ellipse cx="62" cy="38" rx="24" ry="8" fill="none" stroke="#34D399" stroke-width="1.5"/>
    <path d="M 38 38 L 38 64 A 24 8 0 0 0 86 64 L 86 38" fill="none" stroke="#34D399" stroke-width="1.5"/>
    <path d="M 38 51 A 24 8 0 0 0 86 51" fill="none" stroke="#34D399" stroke-width="1.5"/>
    <text x="62" y="95" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">MongoDB</text>
    <text x="62" y="115" fill="#34D399" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">Data Store</text>
  </g>

</svg>
