<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 360" width="100%" height="100%">
  <defs>
    <!-- Markers -->
    <marker id="arrow-sky" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34D399"/>
    </marker>
    <marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#818CF8"/>
    </marker>
  </defs>

  <!-- Flow Header -->
  <g transform="translate(45, 25)">
    <rect x="0" y="0" width="90" height="24" rx="12" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="45" y="16" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing="1">FLOW 02</text>
    <text x="105" y="19" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800">Market Data Ingestion</text>
    <text x="0" y="44" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="12">Dynamic feed adapter routing (Prod vs Local), thread-safe in-memory caching, and historical MongoDB storage</text>
  </g>

  <!-- Connectors -->
  <path d="M 215 200 L 260 200" fill="none" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow-sky)"/>
  <path d="M 430 200 L 475 200" fill="none" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow-sky)"/>
  <path d="M 645 200 L 695 200" fill="none" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow-sky)"/>
  
  <!-- Diamond Branch Out -->
  <!-- Top Branch: Prod -->
  <path d="M 745 170 L 745 145 L 790 145" fill="none" stroke="#34D399" stroke-width="2" marker-end="url(#arrow-emerald)"/>
  <!-- Bottom Branch: Local -->
  <path d="M 745 230 L 745 255 L 790 255" fill="none" stroke="#818CF8" stroke-width="2" marker-end="url(#arrow-indigo)"/>
  
  <!-- Converge to DatafeedContext -->
  <path d="M 980 145 L 1015 145 L 1015 200 L 1040 200" fill="none" stroke="#34D399" stroke-width="2" marker-end="url(#arrow-sky)"/>
  <path d="M 980 255 L 1015 255 L 1015 200" fill="none" stroke="#818CF8" stroke-width="2"/>
  
  <!-- Context to Mongo -->
  <path d="M 1210 200 L 1250 200" fill="none" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow-sky)"/>

  <!-- Step 1: DataFeedController -->
  <g transform="translate(45, 140)">
    <rect x="0" y="0" width="170" height="120" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <text x="85" y="46" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle">DataFeed</text>
    <text x="85" y="66" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle">Controller</text>
    <text x="85" y="92" fill="#38BDF8" font-family="monospace" font-size="9.5" text-anchor="middle">@RestController</text>
  </g>

  <!-- Step 2: DatafeedAdapter -->
  <g transform="translate(260, 140)">
    <rect x="0" y="0" width="170" height="120" rx="10" fill="#1E293B" stroke="#0284C7" stroke-width="2"/>
    <text x="85" y="46" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle">Datafeed</text>
    <text x="85" y="66" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle">Adapter</text>
    <text x="85" y="92" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" text-anchor="middle">Public Entrypoint</text>
  </g>

  <!-- Step 3: DatafeedServiceImpl -->
  <g transform="translate(475, 140)">
    <rect x="0" y="0" width="170" height="120" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <text x="85" y="46" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle">Datafeed</text>
    <text x="85" y="66" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle">ServiceImpl</text>
    <text x="85" y="92" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" text-anchor="middle">Feed Coordinator</text>
  </g>

  <!-- Decision Diamond: FeedAdapterFactory -->
  <g transform="translate(695, 150)">
    <polygon points="50,0 100,50 50,100 0,50" fill="#1E293B" stroke="#FBBF24" stroke-width="2"/>
    <text x="50" y="46" fill="#FBBF24" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">FeedAdapter</text>
    <text x="50" y="61" fill="#FBBF24" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">Factory</text>
  </g>

  <!-- Branch Top: FeedClientAdapter (Prod) -->
  <g transform="translate(790, 105)">
    <rect x="0" y="0" width="190" height="80" rx="8" fill="#1E293B" stroke="#059669" stroke-width="1.8"/>
    <text x="95" y="34" fill="#34D399" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">FeedClientAdapter</text>
    <text x="95" y="55" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" text-anchor="middle">(Production Live Feed)</text>
  </g>

  <!-- Branch Bottom: DummyFeedAdapter (Local) -->
  <g transform="translate(790, 215)">
    <rect x="0" y="0" width="190" height="80" rx="8" fill="#1E293B" stroke="#6366F1" stroke-width="1.8"/>
    <text x="95" y="34" fill="#818CF8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">DummyFeedAdapter</text>
    <text x="95" y="55" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" text-anchor="middle">(Local / Mock Data)</text>
  </g>

  <!-- In-Memory Context: DatafeedContext -->
  <g transform="translate(1040, 140)">
    <rect x="0" y="0" width="170" height="120" rx="10" fill="#1E293B" stroke="#0284C7" stroke-width="2"/>
    <text x="85" y="46" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle">Datafeed</text>
    <text x="85" y="66" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle">Context</text>
    <text x="85" y="92" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" text-anchor="middle">Concurrent Buffer</text>
  </g>

  <!-- Persistence: MongoDB Storage -->
  <g transform="translate(1250, 140)">
    <rect x="0" y="0" width="115" height="120" rx="10" fill="#1E293B" stroke="#059669" stroke-width="2"/>
    <!-- Cylinder database icon -->
    <ellipse cx="57" cy="32" rx="22" ry="7" fill="none" stroke="#34D399" stroke-width="1.5"/>
    <path d="M 35 32 L 35 54 A 22 7 0 0 0 79 54 L 79 32" fill="none" stroke="#34D399" stroke-width="1.5"/>
    <path d="M 35 43 A 22 7 0 0 0 79 43" fill="none" stroke="#34D399" stroke-width="1.5"/>
    <text x="57" y="82" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">MongoDB</text>
    <text x="57" y="100" fill="#34D399" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">Storage</text>
  </g>

</svg>
