spring:
  threads:
    virtual:
      enabled: true
  application:
    name: tragepro-api
  profiles:
    active: local
  config:
    import: "optional:file:.env[.properties],optional:classpath:application-feed.yml"

copper:
  engine:
    thread-count: 10

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
data:
  watchlist:
    identifiers: 6a2ebec538bb66a3fe795919
  scheduler:
    fromDateDays: 90
    enableHistorical: false
    enableIntraday: true

jwt:
  secret: ${JWT_SECRET:UVVETsBqGWkYVZrM+VWTEMPn/aHp+HLjJL8hQlFyytQ=}
  expirationMinutes: ${JWT_EXPIRATION_MINUTES:7200}
  resetPasswordExpirationMinutes: ${JWT_RESET_PASSWORD_EXPIRATION_MINUTES:15}
