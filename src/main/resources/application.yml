spring:
  application:
    name: tragepro-api
  profiles:
    active: local
  config:
    import: "optional:file:.env[.properties],optional:classpath:application-feed.yml"

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

data:
  rest:
    authHeaderPrefix: "Bearer "
    clientIdHeader: "Client-Id"
  socket:
    maxReconnectAttempts: 5
    initialReconnectDelay: 1000
    maxReconnectDelay: 30000
