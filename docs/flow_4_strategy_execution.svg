<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 370" width="100%" height="100%">
  <defs>
    <!-- Markers -->
    <marker id="arrow-sky" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#C084FC"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34D399"/>
    </marker>
  </defs>

  <!-- Flow Header -->
  <g transform="translate(45, 25)">
    <rect x="0" y="0" width="90" height="24" rx="12" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="45" y="16" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing="1">FLOW 04</text>
    <text x="105" y="19" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800">Strategy Pipeline Execution</text>
    <text x="0" y="44" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="12">Chain of Responsibility pipeline evaluating Builder (levels/indicators), Evaluator (signals), and Executor (orders)</text>
  </g>

  <!-- Connectors -->
  <path d="M 195 210 L 240 210" fill="none" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow-sky)"/>
  <path d="M 390 210 L 435 210" fill="none" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow-sky)"/>
  <path d="M 585 210 L 630 210" fill="none" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow-sky)"/>
  <path d="M 780 210 L 825 210" fill="none" stroke="#C084FC" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <path d="M 1135 210 L 1180 210" fill="none" stroke="#34D399" stroke-width="2" marker-end="url(#arrow-emerald)"/>

  <!-- Step 1: Strategy Request -->
  <g transform="translate(45, 145)">
    <rect x="0" y="0" width="150" height="130" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <text x="75" y="50" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle">Strategy</text>
    <text x="75" y="70" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle">Request</text>
    <text x="75" y="98" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" text-anchor="middle">Trigger / Scheduler</text>
  </g>

  <!-- Step 2: StrategyController -->
  <g transform="translate(240, 145)">
    <rect x="0" y="0" width="150" height="130" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <text x="75" y="50" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle">Strategy</text>
    <text x="75" y="70" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle">Controller</text>
    <text x="75" y="98" fill="#38BDF8" font-family="monospace" font-size="9" text-anchor="middle">@RestController</text>
  </g>

  <!-- Step 3: StrategyAdapter -->
  <g transform="translate(435, 145)">
    <rect x="0" y="0" width="150" height="130" rx="10" fill="#1E293B" stroke="#0284C7" stroke-width="2"/>
    <text x="75" y="50" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle">Strategy</text>
    <text x="75" y="70" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle">Adapter</text>
    <text x="75" y="98" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle">Public Boundary</text>
  </g>

  <!-- Step 4: StrategyServiceImpl -->
  <g transform="translate(630, 145)">
    <rect x="0" y="0" width="150" height="130" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <text x="75" y="50" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle">Strategy</text>
    <text x="75" y="70" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle">ServiceImpl</text>
    <text x="75" y="98" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle">Pipeline Manager</text>
  </g>

  <!-- Step 5: Strategy Execution Pipeline (Container) -->
  <g transform="translate(825, 95)">
    <!-- Container Card -->
    <rect x="0" y="0" width="310" height="230" rx="12" fill="#0F172A" stroke="#9333EA" stroke-width="2"/>
    <text x="155" y="27" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" text-anchor="middle">Strategy Execution Pipeline</text>
    
    <!-- Sub-step 1: Builder -->
    <rect x="18" y="44" width="274" height="50" rx="6" fill="#1E293B" stroke="#A855F7" stroke-width="1.5"/>
    <text x="155" y="66" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">1. Builder Stage</text>
    <text x="155" y="82" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" text-anchor="middle">OHLCV, Indicators, VWAP, Levels</text>
    
    <!-- Sub-step 2: Evaluator -->
    <rect x="18" y="103" width="274" height="50" rx="6" fill="#1E293B" stroke="#A855F7" stroke-width="1.5"/>
    <text x="155" y="125" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">2. Evaluator Stage</text>
    <text x="155" y="141" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" text-anchor="middle">Liquidity Filter &amp; Signal Generation</text>
    
    <!-- Sub-step 3: Executor -->
    <rect x="18" y="162" width="274" height="50" rx="6" fill="#1E293B" stroke="#A855F7" stroke-width="1.5"/>
    <text x="155" y="184" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">3. Executor Stage</text>
    <text x="155" y="200" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" text-anchor="middle">Position Sizing &amp; Action Dispatch</text>
  </g>

  <!-- Step 6: StrategyResponse Result -->
  <g transform="translate(1180, 145)">
    <rect x="0" y="0" width="180" height="130" rx="10" fill="#1E293B" stroke="#059669" stroke-width="2"/>
    <circle cx="90" cy="35" r="14" fill="#0F172A" stroke="#34D399" stroke-width="1.5"/>
    <path d="M 83 35 L 88 40 L 97 30" fill="none" stroke="#34D399" stroke-width="1.8" stroke-linecap="round"/>
    <text x="90" y="70" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">StrategyResponse</text>
    <text x="90" y="90" fill="#34D399" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Result</text>
    <text x="90" y="112" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle">Actionable Trade Signal</text>
  </g>

</svg>
